<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 2 200 200" fill="none">
  <!-- Outer Rounded Container (Subtle soft background) -->
  <rect x="20" y="2" width="200" height="200" rx="44" fill="#FFFFFF"/>
  
  <!-- Main Heart Border (Emerald Green) -->
  <path d="M120 180 C80 150 42 118 42 78 C42 46 68 24 98 24 C107 24 116 28 120 34 C124 28 133 24 142 24 C172 24 198 46 198 78 C198 118 160 150 120 180 Z" 
        fill="none" 
        stroke="#059669" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Floating Mini Heart on Top Right -->
  <path d="M165 32 C158 24 148 30 153 38 L165 48 L177 38 C182 30 172 24 165 32 Z" 
        fill="#059669"/>

  <!-- Group for Dog & Cat Cuddled Inside -->
  <g transform="translate(0, 0)">
    <!-- Dog Body & Head (Golden Amber #F59E0B) -->
    <path d="M82 172 C70 148 68 120 72 95 C75 75 88 56 108 52 C128 48 144 60 150 78 C153 87 150 98 144 105 C138 112 126 116 116 122 C104 130 92 148 82 172 Z" 
          fill="#F59E0B"/>
    
    <!-- Dog Floppy Ear (Deeper Amber #D97706) -->
    <path d="M96 64 C86 66 78 78 80 94 C82 110 94 122 104 122 C108 122 110 118 108 112 C104 98 100 80 96 64 Z" 
          fill="#D97706"/>
    
    <!-- Dog Eye (Happy Curved Arc) -->
    <path d="M124 78 C128 73 135 73 139 78" 
          stroke="#1E293B" 
          stroke-width="3" 
          stroke-linecap="round" 
          fill="none"/>
    
    <!-- Dog Nose -->
    <ellipse cx="148" cy="88" rx="4" ry="3" fill="#1E293B"/>

    <!-- Cat (White #FFFFFF with subtle green outline) -->
    <!-- Cat Head & Body -->
    <path d="M102 170 C96 150 102 128 116 116 C124 109 135 106 145 108 C158 111 168 122 168 138 C168 152 160 164 148 170 C134 176 116 176 102 170 Z" 
          fill="#FFFFFF" 
          stroke="#059669" 
          stroke-width="2.5"/>
    
    <!-- Cat Left Ear -->
    <path d="M120 110 L126 94 L136 106 Z" fill="#FFFFFF" stroke="#059669" stroke-width="2" stroke-linejoin="round"/>
    <path d="M124 107 L127 98 L133 105 Z" fill="#FCE7F3"/>

    <!-- Cat Right Ear -->
    <path d="M152 108 L164 96 L166 114 Z" fill="#FFFFFF" stroke="#059669" stroke-width="2" stroke-linejoin="round"/>
    <path d="M156 109 L162 101 L163 111 Z" fill="#FCE7F3"/>

    <!-- Cat Eye (Happy Closed Arc) -->
    <path d="M128 126 C131 122 137 122 140 126" 
          stroke="#1E293B" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          fill="none"/>

    <!-- Cat Nose -->
    <polygon points="121,133 125,133 123,136" fill="#1E293B"/>
    <!-- Cat Smile -->
    <path d="M121 136 Q118 139 116 138" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M123 136 Q125 139 127 138" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Cat Whiskers -->
    <line x1="114" y1="134" x2="105" y2="132" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="113" y1="138" x2="104" y2="140" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="114" y1="142" x2="107" y2="147" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
